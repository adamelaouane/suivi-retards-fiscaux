<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | Suivi Fiscal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { min-height: 100vh; display: grid; place-items: center; background: #eef3f9; }
        .auth-card { width: min(420px, calc(100% - 32px)); background: #fff; padding: 2rem; border-radius: 16px; box-shadow: 0 12px 35px rgba(23,54,93,.12); }
        .auth-brand { text-align: center; margin-bottom: 1.7rem; }
        .auth-logo { width: 54px; height: 54px; display: grid; place-items: center; margin: 0 auto 12px; border-radius: 14px; color: #fff; background: #24558a; font-weight: 800; }
        .auth-card label { display: block; margin: 14px 0 6px; font-weight: 600; }
        .auth-card input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; }
        .auth-submit { width: 100%; margin-top: 20px; padding: 12px; border: 0; border-radius: 8px; color: #fff; background: #24558a; font-weight: 700; cursor: pointer; }
        .auth-message { padding: 10px; margin-bottom: 10px; border-radius: 7px; background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <main class="auth-card">
        <div class="auth-brand">
            <div class="auth-logo">SF</div>
            <h1>Suivi Fiscal</h1>
            <p>Connectez-vous à votre espace de travail</p>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}<div class="auth-message">{{ message }}</div>{% endfor %}
        {% endwith %}
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="username">Nom d'utilisateur</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>
            <label for="password">Mot de passe</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="auth-submit" type="submit">Se connecter</button>
        </form>
    </main>
</body>
</html>
